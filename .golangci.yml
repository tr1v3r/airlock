version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - nolintlint
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: receiver-naming
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: []
formatters:
  enable:
    - gofmt
    - gci
  settings:
    gofmt:
      simplify: false
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/tr1v3r/airlock)
      custom-order: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
