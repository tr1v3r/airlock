name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  quality:
    name: Format, style and modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Upgrade this toolchain together with golangci-lint. Newer Go export
          # formats can break its analyzers even when SDK tests still pass.
          go-version: '1.27.0'
      - run: bash scripts/check.sh format
      - run: bash scripts/check.sh modules
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install pinned quality tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: golangci-lint config verify
      - run: golangci-lint run
      - run: actionlint -color

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ['1.24.x', '1.25.x', oldstable, stable]
        include:
          - os: macos-latest
            go: stable
          - os: windows-latest
            go: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test -shuffle=on -count=1 -timeout=5m ./...
      - run: go vet ./...
      - name: Run documented local examples
        shell: bash
        run: bash scripts/check.sh examples
      - name: Test independent modules on each supported toolchain and OS
        shell: bash
        run: |
          for manifest in driver/*/go.mod; do
            (cd "$(dirname "$manifest")" && go test -shuffle=on -count=1 -timeout=5m ./... && go vet ./...)
          done

  race:
    name: Race and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: bash scripts/check.sh coverage
      - name: Exercise concurrency with different CPU counts and test orders
        run: go test -race -shuffle=on -count=10 -cpu=1,2,4 -timeout=5m ./...
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  drivers:
    name: Independent driver modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: bash scripts/driver-check.sh
      - name: Run Shared hello and lifecycle examples
        working-directory: driver/memory
        run: |
          go run ./examples/hello
          go run ./examples/lifecycle

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: airlock
          POSTGRES_PASSWORD: airlock
          POSTGRES_DB: airlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U airlock -d airlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Real database protocol and fault tests
        working-directory: driver/postgres
        env:
          AIRLOCK_POSTGRES_DSN: postgres://airlock:airlock@127.0.0.1:5432/airlock?sslmode=disable
        run: go test -race -shuffle=on -count=1 -timeout=5m ./...

  postgres-failover:
    name: PostgreSQL synchronous failover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: bash scripts/postgres-failover.sh

  redis:
    name: Redis ${{ matrix.redis }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        redis: ['7', '8']
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Real Redis protocol tests
        working-directory: driver/redis
        env:
          AIRLOCK_REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -shuffle=on -count=1 -timeout=5m ./...
      - name: Run distributed example
        working-directory: driver/redis
        env:
          AIRLOCK_REDIS_ADDR: 127.0.0.1:6379
        run: go run ./examples/basic

  redis-cluster:
    name: Redis Cluster and asynchronous failover boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: bash scripts/redis-cluster.sh
      - run: bash scripts/redis-failover.sh

  security:
    name: Vulnerabilities (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ['.', driver/memory, driver/postgres, driver/redis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck -test ./...
        working-directory: ${{ matrix.module }}

  installation:
    name: Published consumer installation
    # Fork and merge-queue synthetic SHAs need not be resolvable as module versions.
    # Those events are explicitly not claimed as published-installation evidence.
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install documented dev and the pushed candidate without replace
        env:
          CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/install-smoke.sh "$CANDIDATE"

  stress:
    name: Bounded concurrency and fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: bash scripts/stress.sh quick

  extended:
    name: Extended concurrency and fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: bash scripts/stress.sh extended

  gate:
    name: CI Gate
    if: always()
    needs: [quality, test, race, security, drivers, postgres, postgres-failover, redis, redis-cluster, installation, stress, extended]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          allowed_skips = set()
          if os.environ['EVENT_NAME'] not in ('schedule', 'workflow_dispatch'):
              allowed_skips.add('extended')
          if os.environ['EVENT_NAME'] == 'merge_group' or (os.environ['EVENT_NAME'] == 'pull_request' and os.environ['IS_FORK'] == 'true'):
              allowed_skips.add('installation')
          failed = {name: job['result'] for name, job in results.items()
                    if job['result'] != 'success' and not (job['result'] == 'skipped' and name in allowed_skips)}
          if failed:
              print(f'CI gate failed: {failed}')
              sys.exit(1)
          print('All required CI jobs passed; allowed skips:', sorted(allowed_skips))
          PYTHON
