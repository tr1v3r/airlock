name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  quality:
    name: Format, style and modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Upgrade this toolchain together with golangci-lint. Newer Go export
          # formats can break its analyzers even when SDK tests still pass.
          go-version: '1.27.0'
      - run: bash scripts/check.sh format
      - run: bash scripts/check.sh modules
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install pinned quality tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: golangci-lint config verify
      - run: golangci-lint run
      - run: actionlint -color

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ['1.24.x', '1.25.x', oldstable, stable]
        include:
          - os: macos-latest
            go: stable
          - os: windows-latest
            go: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test -shuffle=on -count=1 -timeout=5m ./...
      - run: go vet ./...
      - name: Run documented examples
        shell: bash
        run: bash scripts/check.sh examples

  race:
    name: Race and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: bash scripts/check.sh coverage
      - name: Exercise concurrency with different CPU counts and test orders
        run: go test -race -shuffle=on -count=10 -cpu=1,2,4 -timeout=5m ./...
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  security:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck -test ./...

  gate:
    name: CI Gate
    if: always()
    needs: [quality, test, race, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              print(f'CI gate failed: {failed}')
              sys.exit(1)
          print('All required CI jobs passed.')
          PYTHON
